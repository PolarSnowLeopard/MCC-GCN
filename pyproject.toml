[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mcc-gcn"
version = "0.1.0"
description = "Multi-Component Crystal Graph Convolutional Network"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.2",
    "pandas>=1.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "tqdm>=4.64",
    "cirpy>=1.0",
    "requests>=2.28",
]

[tool.setuptools.packages.find]
include = ["mcc_gcn*"]
